services:
  app:
    build: .
    image: random-pass_img
    volumes:
      - ./app:/app
    working_dir: /app
    container_name: "random-pass_ctn"
    hostname: "random-pass_hst"
    ports:
      - 1234:1234
    entrypoint: [ "yarn", "dev" ]
    # entrypoint: [ "sh", "-c", "sleep 2073600" ]
  cypress:
    image: cypress/included:15.18.1
    depends_on:
      - app
    volumes:
      - ./app:/e2e
    working_dir: /e2e
    environment:
      CYPRESS_baseUrl: http://app:1234
    entrypoint: [ "cypress", "run" ]
