services:
  app:
    build: .
    image: random-pass_img
    volumes:
      - ./app:/app
      - /app/node_modules
    working_dir: /app
    container_name: "random-pass_ctn"
    hostname: "random-pass_hst"
    ports:
      - 1234:1234
    entrypoint: [ "yarn", "dev" ]
    # entrypoint: [ "sh", "-c", "sleep 2073600" ]
  cypress:
    build:
      context: .
      target: e2e
    depends_on:
      - app
    network_mode: service:app
    volumes:
      - ./app/cypress.config.js:/e2e/cypress.config.js:ro
      - ./app/cypress:/e2e/cypress:ro
    environment:
      CYPRESS_BASE_URL: http://127.0.0.1:1234
